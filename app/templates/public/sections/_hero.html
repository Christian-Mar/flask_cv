{% from "components/layout.html" import social_links %}
<section id="hero" class="hero section dark-background">

  <img src="{{ url_for('static', filename='assets/img/' ~ cv.profile.hero_image) }}" alt="" data-aos="fade-in">

  <div class="container" data-aos="fade-up" data-aos-delay="100">
    <div class="row justify-content-center">
      <div class="col-lg-8 text-center">
        <h2>Hoi, ik ben {{ cv.profile.name }}</h2>
        <p>Ik ben <span class="typed" data-typed-items="{{ cv.profile.roles | join(', ') }}"></span><span class="typed-cursor" aria-hidden="true"></span></p>
        {{ social_links(cv.profile.social) }}
      </div>
    </div>
  </div>

</section>
